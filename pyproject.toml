[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gotracker"
dynamic = ["version"]
description = "Poll the GO Sharing vehicle API and record e-moped movements in MySQL"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "PyMySQL>=1.0", "python-dotenv>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gotracker = "gotracker.cli:main"

[tool.setuptools]
packages = ["gotracker"]

[tool.setuptools.dynamic]
version = { attr = "gotracker.__version__" }

[tool.setuptools.package-data]
gotracker = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`; long SQL/HTML strings are fine
